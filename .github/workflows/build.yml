name: Build

# Builds LAN Deck for Windows, macOS and Linux and tests it on each.
# Pushing a tag like v1.0.0 also publishes a GitHub Release with the downloads.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, target: windows }
          - { name: macOS (Apple Silicon), os: macos-latest, target: macos-arm64 }
          - { name: Linux, os: ubuntu-22.04, target: linux-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Version
        id: version
        run: echo "version=$(python -c "import re;print(re.search(r'VERSION = \"(.+?)\"', open('app.py').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - name: Test the server on this OS (from source)
        run: python packaging/smoke_test.py

      - name: Build the app
        run: |
          python packaging/make_icons.py
          pyinstaller --noconfirm --clean packaging/lan_deck.spec

      - name: Test the packaged app
        run: |
          case "${{ matrix.target }}" in
            windows) exe="dist/LANDeck.exe" ;;
            macos-*) exe="dist/LAN Deck.app/Contents/MacOS/LAN Deck" ;;
            *)       exe="dist/lan-deck" ;;
          esac
          python packaging/smoke_test.py --exe "$exe"

      - name: Package (Windows installer + portable exe)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} packaging\windows\LANDeck.iss
          Copy-Item dist\LANDeck.exe "release\LAN-Deck-${{ steps.version.outputs.version }}-windows-portable.exe"

      - name: Package (macOS disk image)
        if: startsWith(matrix.target, 'macos')
        run: |
          mkdir -p release dmg
          cp -R "dist/LAN Deck.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "LAN Deck" -srcfolder dmg -ov -format UDZO "release/LAN-Deck-${{ steps.version.outputs.version }}-${{ matrix.target }}.dmg"

      - name: Package (Linux tarball)
        if: matrix.target == 'linux-x64'
        run: |
          name="LAN-Deck-${{ steps.version.outputs.version }}-linux-x64"
          mkdir -p "release/$name"
          cp dist/lan-deck packaging/linux/install.sh install-gnome-extension.sh "release/$name/"
          cp -R gnome-extension "release/$name/"
          cp build/icon-256.png "release/$name/lan-deck.png"
          chmod +x "release/$name/lan-deck" "release/$name/install.sh" "release/$name/install-gnome-extension.sh"
          tar -C release -czf "release/$name.tar.gz" "$name"
          rm -rf "release/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: lan-deck-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* --repo "${{ github.repository }}" \
            --title "LAN Deck ${{ github.ref_name }}" --generate-notes
